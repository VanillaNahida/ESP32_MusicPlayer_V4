; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32-s3-devkitc1-n8r8
framework = arduino
; 模组：ESP32-S3-WROOM-1-N16R8（16MB Flash + 8MB OPI PSRAM）
; 板卡默认按 N8R8 配置（variant=esp32s3，memory_type=qio_opi，psram_type=opi，含 -DBOARD_HAS_PSRAM）
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
board_build.partitions = partitions.csv
lib_archive = yes

; 主循环任务（core1，Arduino 的 loopTask）栈加大到 16KB。
; 原因：重建播放列表时要在 loop() 里逐个打开曲目、解析 ID3 标签
; （AudioFileSourceFS + AudioFileSourceID3 都是栈上对象，ID3 解析还有
;  若干百字节级的临时缓冲）。默认 8KB 虽然大概率够用，但一旦碰上天
; 花板就是难查的随机崩溃，直接给足更省心。
build_flags =
	-DARDUINO_LOOP_STACK_SIZE=16384

	; ── 性能浮窗（帧率 / CPU / 内存）──
	; 打开后在屏幕左上方显示一块半透明浮窗，挂在 lv_layer_top() 上，
	; 切到播放列表页也不会消失。内容是：
	;     FPS  = LVGL 实际刷新帧率（界面静止时为 0，属正常）
	;     Loop = 主循环频率（正常 ~200Hz，掉下来说明有地方在阻塞）
	;     Int  = 内部堆空闲（关键指标，掉到几十 KB 就要警惕）
	;     PS   = PSRAM 空闲
	;     LV   = LVGL 内存池使用率
	;     Stk  = 当前任务剩余栈
	; 位置：x=2, y=30, 126x82 —— 下移到顶栏(y0~25)之下，
	;       刻意避开左上角返回按钮（含图标 9px 扩大命中区）。
	; 关闭方式：注释掉下面这行，或改成 =0（默认关闭）。
	; -DENABLE_PERF_OVERLAY=1

	; ── 外部字库（SD 卡上的 .bin 字体，按需读入 PSRAM）──
	; 打开后 FontManager 才会去卡上找 /fonts/*.bin、建立索引并按需读字形；
	; 关闭（默认）时**完全不碰 SD 卡**，只用固件内置的全量字库 ——
	; 内置字库已经是 DreamHanSansSC-W17 的 44,812 字形（全部 CJK / 假名 /
	; 拉丁 / 全角符号），所以默认关闭就够了：启动最快、渲染零读卡。
	;
	; 什么时候需要打开：想换字体又不想重新烧录固件时 ——
	; 用 tools/gen_lvgl_font_bin.py 生成 .bin 丢到卡的 /fonts/ 下即可。
	; 代价：渲染到没缓存过的字时要在渲染路径里读一次 SD（~1ms/字），
	;       有大缓存兜底、稳定后基本零读卡，但仍会占一点 PSRAM。
	; -DENABLE_EXTERNAL_FONT=1

	; ── 音频链路性能埋点（仅测量用，测完注释掉）──
	; 用于定位高解析度 FLAC（96kHz/24bit）断续/爆音的瓶颈在哪一环。
	; 打开后主循环每秒打一行 [PROF]，内容是各环节的「每秒」统计：
	;     sd:   rd=读次数/s  KB/s=实际吞吐  lock=等总线锁us/s  io=锁内读us/s
	;     flac: dec=解码次数/s  us=解码累计us/s  out=出帧/s  bud=预算提前退出次数
	;     i2s:  写次数/s  写入累计us/s     win=统计窗口ms
	; 判据：out 必须达到采样率（96kHz 文件要 ~96000/s，低了必然断续）；
	;       bud 非 0 说明解码跟不上；lock 高说明被 TFT 刷屏抢占。
	; 开销：只有 micros() 与 +=，且只在 core0 累加、core1 打印，不影响音频。
	; -DENABLE_AUDIO_PROFILE=1
lib_deps = 
	paulstoffregen/XPT2046_Touchscreen@0.0.0-alpha+sha.26b691b2c8
