; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32-s3-devkitc1-n8r8
framework = arduino
; 模组：ESP32-S3-WROOM-1-N16R8（16MB Flash + 8MB OPI PSRAM）
; 板卡默认按 N8R8 配置（variant=esp32s3，memory_type=qio_opi，psram_type=opi，含 -DBOARD_HAS_PSRAM）
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
board_build.partitions = partitions.csv
lib_archive = yes

; 主循环任务（core1，Arduino 的 loopTask）栈加大到 16KB。
; 原因：重建播放列表时要在 loop() 里逐个打开曲目、解析 ID3 标签
; （AudioFileSourceFS + AudioFileSourceID3 都是栈上对象，ID3 解析还有
;  若干百字节级的临时缓冲）。默认 8KB 虽然大概率够用，但一旦碰上天
; 花板就是难查的随机崩溃，直接给足更省心。
build_flags =
	-DARDUINO_LOOP_STACK_SIZE=16384
lib_deps = 
	paulstoffregen/XPT2046_Touchscreen@0.0.0-alpha+sha.26b691b2c8
